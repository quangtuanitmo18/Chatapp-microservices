version: "3.8"

services:
  # MongoDB Service
  database:
    image: mongo:latest
    container_name: database
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
    networks:
      - app-network
    restart: always

  # Website Service
  backend-website:
    build:
      context: ./backend/website
      dockerfile: Dockerfile
    container_name: backend-website
    networks:
      - app-network
    depends_on:
      - database

  # Chat Service (WebSocket functionality)
  backend-chat:
    build:
      context: ./backend/chat
      dockerfile: Dockerfile
    container_name: backend-chat
    networks:
      - app-network
    depends_on:
      - database

  # Frontend Service
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks:
      - app-network
    depends_on:
      - backend-website
      - backend-chat

  # Nginx Service (API Gateway)
  nginx:
    image: nginx:alpine
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf # Nginx configuration file
    networks:
      - app-network
    depends_on:
      - frontend
      - backend-website
      - backend-chat

# Define shared network and volume
networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
